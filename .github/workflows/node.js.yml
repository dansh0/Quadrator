# CI: lint, typecheck, unit tests (with the core coverage floor) and the
# Playwright E2E suite run on pushes to main and on every PR to main.
# Version bump runs on main only. The Windows installer is built on demand
# by build-desktop.yml (manual dispatch).

name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: "Lint, Typecheck & Unit Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v7
      - name: "Setup pnpm"
        uses: pnpm/action-setup@v6
      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile
      - name: "Lint"
        run: pnpm lint
      - name: "Typecheck (all workspaces)"
        run: pnpm typecheck
      - name: "Unit tests (+ core coverage floor)"
        run: pnpm test:coverage

  e2e:
    name: "Web E2E (Playwright)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v7
      - name: "Setup pnpm"
        uses: pnpm/action-setup@v6
      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile
      - name: "Install Playwright browser"
        run: pnpm --filter @quadrator/web exec playwright install chromium --with-deps
      - name: "E2E tests"
        run: pnpm --filter @quadrator/web e2e
      - name: "Archive report on failure"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  bump-version:
    name: "Bump Version"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: '2'
      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # No pnpm in this job; stop setup-node auto-caching from the
          # root packageManager field.
          package-manager-cache: false
      # Best-effort convenience: bumps the ROOT package.json patch version
      # only (the single source of truth). apps/desktop/package.json picks it
      # up at build time via apps/desktop/build.mjs. Left non-blocking on
      # purpose — a failed bump must not fail the build of a good commit.
      # Bumps from the pushed commit's own version, and skips entirely when
      # that commit already changed the version (a manual minor/major bump is
      # kept exactly as written). HEAD~1 is the first parent, so a merge that
      # brings in a new version counts as a manual bump.
      - name: "Automated Version Bump"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if git diff HEAD~1 HEAD -- package.json | grep -q '"version"'; then
            echo "Version set manually in this push; skipping bump."
          else
            npm version patch
            git push origin ${{ github.ref }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

