# CI: lint + typecheck + tests on every push/PR to main; version bump and
# Windows installer build on pushes to main.

name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: "Lint, Typecheck & Unit Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4
      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile
      - name: "Lint"
        run: pnpm lint
      - name: "Typecheck (all workspaces)"
        run: pnpm typecheck
      - name: "Unit tests"
        run: pnpm test

  bump-version:
    name: "Bump Version"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: '2'
      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "Automated Version Bump"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          oldVersion=$(echo $(git show $(git log --first-parent -1 --skip 1 --pretty=format:"%H"):package.json) | jq -r ".version")
          echo "$oldVersion"
          IFS='.' read -r -a versionArray <<< "$oldVersion"
          ((versionArray[2]=versionArray[2]+1))
          newVersion="${versionArray[@]}"
          newVersion=${newVersion// /.}
          npm version "$newVersion"
          git push origin ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  build-exe:
    name: "Build Quadrator (Windows installer)"
    runs-on: windows-latest

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4
      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile
      - name: "Build installer"
        continue-on-error: true
        run: pnpm package:desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Parse version"
        run: |
          echo "Q_VERSION=$(jq -r .version package.json)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Archive installer
        uses: actions/upload-artifact@v4
        with:
          name: Quadrator-${{env.Q_VERSION}}
          path: |
            apps/desktop/release/*.exe
